name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax prüfen
        run: for f in src/*.js tools/*.js ui/app.js; do node --check "$f"; done
      - name: Tests
        run: node test/run.js
